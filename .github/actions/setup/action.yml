name: Set up the toolchain
description: .NET and Node with their package caches, and the frontend's dependencies installed.

inputs:
  frontend:
    description: Set up Node and install the frontend's dependencies.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - if: inputs.frontend == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/Tript.Web/package-lock.json

    - if: inputs.frontend == 'true'
      name: Install frontend dependencies
      shell: bash
      working-directory: src/Tript.Web
      run: npm ci
