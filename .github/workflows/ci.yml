# The gate that `make test` is: the .NET unit suites plus the frontend, on every push and PR.
#
# The OBS integration suite is deliberately not here. It needs OBS >= 30.1, a display server and the
# obs-ffmpeg-mux helper, and on a runner without them it fails for reasons unrelated to the change
# under test — which is how a red gate stops being read. `make test-integration` runs it locally.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The detection models live in Git LFS, and those tests pin the tensor layout against the
          # real weights, so they fail outright rather than skipping without them — deliberately.
          # Note the failure is an opaque ONNX Runtime protobuf-parse error, not a "no model found":
          # an unfetched LFS pointer is still a file, so every existence check upstream of the load
          # passes first.
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Tript.Web/package-lock.json

      # ffprobe backs the library's duration and thumbnail paths; Tript.Media.Tests drives the real
      # binaries rather than a fake, so they have to be present.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install frontend dependencies
        working-directory: src/Tript.Web
        run: npm ci

      - name: Build
        run: dotnet build Tript.slnx -c Release --nologo

      - name: Test
        run: make test CONFIG=Release

      # Restore writes packages.lock.json, so a build or test that rewrites it means the
      # committed lock files no longer describe the build. That used to pass silently and
      # only surfaced later as NU1004 on a locked Windows publish.
      - name: Lock files are unchanged by the build
        run: git diff --exit-code -- '*packages.lock.json'
