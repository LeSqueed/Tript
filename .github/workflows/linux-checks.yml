# The Linux counterpart of windows-checks.yml: builds the tarball users download, installs it into a
# throwaway home and starts the packaged app host until it reports READY. Called by ci.yml on every
# push and by release.yml, which must not publish a Linux package nothing has ever started.
name: Linux checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Tript.Web/package-lock.json

      - name: Build the Linux package
        run: make linux-package CONFIG=Release

      - name: The package installs for a user and starts
        run: |
          VERSION="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)"
          PACKAGE="Tript-${VERSION}-linux-x64"
          (cd dist/Release-linux && sha256sum -c "${PACKAGE}.tar.gz.sha256")
          UNPACKED="$RUNNER_TEMP/unpacked"
          mkdir -p "$UNPACKED" "$RUNNER_TEMP/home"
          tar -xzf "dist/Release-linux/${PACKAGE}.tar.gz" -C "$UNPACKED"
          HOME="$RUNNER_TEMP/home" sh "$UNPACKED/${PACKAGE}/install.sh"
          APP="$RUNNER_TEMP/home/.local/opt/tript/app"
          tests/Tript.Smoke/test-app-host-ready.sh "$APP/Tript.App" "$APP/dist" 90

