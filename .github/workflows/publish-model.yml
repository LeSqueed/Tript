# SUPERSEDED - this is not how models reach users any more. Live delivery is via the resolver: the
# app reads its manifest from the resolver's /manifest endpoint whenever a resolver.json is present
# (every build has one), and models are published to the resolver through its admin API
# (ResolverAdminClient.PublishAsync) from the in-app Training UI. This workflow still produces valid
# immutable assets on the model-assets-v1 tag, but they are only installable by an app with no
# resolver.json, and data/model-manifest.json currently lists no releases. Kept for that fallback
# route. See docs/model-publication.md.
name: Publish model asset

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Game directory and stable game ID
        required: true
        default: Overwatch
        type: string
      model_api_version:
        description: Runtime/model contract version
        required: true
        default: "1"
        type: string
      revision:
        description: Immutable numeric model revision (for example, 2)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-assets-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and model data
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate runtime model contract
        shell: bash
        run: >-
          dotnet run --project src/Tript.ModelValidator/Tript.ModelValidator.csproj
          --configuration Release --framework net10.0 --
          "data/models/${{ inputs.game_id }}/model.onnx"
          "data/models/${{ inputs.game_id }}/events.json"
          "${{ inputs.model_api_version }}"

      - name: Validate and package model
        id: package
        env:
          INPUT_GAME_ID: ${{ inputs.game_id }}
          INPUT_MODEL_API_VERSION: ${{ inputs.model_api_version }}
          INPUT_REVISION: ${{ inputs.revision }}
        shell: bash
        run: >-
          python scripts/package-model.py
          --source-dir "data/models/$INPUT_GAME_ID"
          --output-dir "${{ runner.temp }}/model-assets"
          --game-id "$INPUT_GAME_ID"
          --model-api-version "$INPUT_MODEL_API_VERSION"
          --revision "$INPUT_REVISION"
          --catalog-manifest data/model-manifest.json
          --repository "${{ github.repository }}"

      - name: Validate updated download manifest
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema==0.36.1
          check-jsonschema --schemafile data/model-manifest.schema.json data/model-manifest.json

      - name: Create long-lived release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: model-assets-v1
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Tript model assets v1" \
              --notes "Immutable detection model packages. Assets are added only by the manual model publication workflow."
          fi

      - name: Upload immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: model-assets-v1
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          ASSET_SHA256: ${{ steps.package.outputs.asset_sha256 }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fqx -- "$ASSET_NAME"; then
            mkdir -p "${{ runner.temp }}/existing-model-asset"
            gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" \
              --dir "${{ runner.temp }}/existing-model-asset"
            EXISTING_SHA256="$(sha256sum "${{ runner.temp }}/existing-model-asset/$ASSET_NAME" | cut -d ' ' -f 1)"
            if [[ "$EXISTING_SHA256" != "$ASSET_SHA256" ]]; then
              echo "Refusing to replace existing release asset with different content: $ASSET_NAME" >&2
              exit 1
            fi
            echo "The exact immutable asset already exists; continuing the manifest update."
          else
            gh release upload "$RELEASE_TAG" "$ASSET_PATH"
          fi

      - name: Open manifest update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: model-manifest/${{ inputs.game_id }}-api${{ inputs.model_api_version }}-r${{ inputs.revision }}
          commit-message: "models: publish ${{ inputs.game_id }} api${{ inputs.model_api_version }} r${{ inputs.revision }}"
          title: "models: publish ${{ inputs.game_id }} API ${{ inputs.model_api_version }} revision ${{ inputs.revision }}"
          body: |
            Publishes the immutable model asset produced by workflow run `${{ github.run_id }}`.

            The manifest records the exact release URL, byte size, and SHA-256 verified by the app before installation.
          add-paths: data/model-manifest.json

      - name: Record publication details
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_SIZE: ${{ steps.package.outputs.asset_size_bytes }}
          ASSET_SHA256: ${{ steps.package.outputs.asset_sha256 }}
        shell: bash
        run: |
          {
            echo "### Published model asset"
            echo
            echo "- Asset: \`$ASSET_NAME\`"
            echo "- Size: \`$ASSET_SIZE\` bytes"
            echo "- SHA-256: \`$ASSET_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
