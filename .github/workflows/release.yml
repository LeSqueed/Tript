# Builds the Windows bundle and the Linux tarball and publishes them as a GitHub Release whenever a version tag is
# pushed. Runs on ubuntu-latest, not windows-latest: `make windows` cross-compiles the whole bundle
# (dotnet publish -r win-x64, plain shell, and the apt-installable mingw-w64 cross-compiler for the
# native launcher) without ever needing a Windows host, matching how `README.md` already builds it.
#
# This workflow does not publish detection models. Model delivery is a separate, already-live
# concern: GameModelManager fetches its manifest from the production resolver's /manifest endpoint
# (see the resolver.json step below) rather than data/model-manifest.json whenever a resolver.json
# is present, and models reach the resolver via its own admin API (ResolverAdminClient), not this
# workflow or publish-model.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The bundle is cross-compiled below and never started there, and a tag push does not run
  # ci.yml, so without this a release could go out on a Windows build nothing had ever launched.
  windows:
    uses: ./.github/workflows/windows-checks.yml

  linux:
    uses: ./.github/workflows/linux-checks.yml

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Tript.Web/package-lock.json

      - name: Install system dependencies
        # ffmpeg backs Tript.Media.Tests (the test gate below); mingw-w64 cross-compiles the
        # native Windows launcher later in this job.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mingw-w64

      - name: Install frontend dependencies
        working-directory: src/Tript.Web
        run: npm ci

      - name: Build
        run: dotnet build Tript.slnx -c Release --nologo

      - name: Test
        # A tag push does not run ci.yml (it only triggers on branches), so this workflow is the
        # only gate a tagged release goes through, so it must run the full suite itself, not just
        # rebuild. Uses the same `make test` ci.yml runs, so the two gates never drift apart.
        run: make test CONFIG=Release

      - name: Verify tag matches Directory.Build.props version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "<Version>${TAG_VERSION}</Version>" Directory.Build.props; then
            echo "Tag $GITHUB_REF_NAME does not match <Version> in Directory.Build.props" >&2
            exit 1
          fi

      - name: Point resolver.json at the production resolver
        # config/resolver.json ships via a Content Include (Tript.App.csproj) that copies it
        # verbatim into the publish output as ./resolver.json. Overwriting the checkout's copy
        # here (never committed back) means `make windows` bakes the production resolver into
        # the release build instead of the checked-in localhost dev default.
        env:
          RESOLVER_URL: ${{ secrets.RESOLVER_URL }}
          RESOLVER_API_KEY: ${{ secrets.RESOLVER_API_KEY }}
        run: |
          jq -n --arg url "$RESOLVER_URL" --arg key "$RESOLVER_API_KEY" \
            '{url: $url, apiKey: $key}' > config/resolver.json

      - name: Build Windows bundle
        run: make windows CONFIG=Release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Tript-${VERSION}-win-x64.zip"
          (cd dist && mv Release-win Tript && zip -r "../$ZIP" Tript)
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Build Linux package
        run: |
          make linux-package CONFIG=Release
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="Tript-${VERSION}-linux-x64.tar.gz"
          mv "dist/Release-linux/$TARBALL" "dist/Release-linux/$TARBALL.sha256" .
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP" "$ZIP.sha256" "$TARBALL" "$TARBALL.sha256" \
            --title "Tript $GITHUB_REF_NAME" \
            --generate-notes \
            "${FLAGS[@]}"
