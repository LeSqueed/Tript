# Publishes a GitHub Release for a version tag in stages: the tag is checked, the full test suite
# runs, each platform is built and checked on its own, and only then are all four files published
# together, so a release never goes out with one platform missing.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false

      - id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "<Version>${VERSION}</Version>" Directory.Build.props; then
            echo "::error title=Version::Tag $GITHUB_REF_NAME does not match <Version> in Directory.Build.props"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-alpha* || "$VERSION" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: verify
    uses: ./.github/workflows/tests.yml

  release-windows:
    name: Release (Windows)
    needs: [verify, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE: Tript-${{ needs.verify.outputs.version }}-win-x64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup

      - name: Install the launcher's cross-compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      # Tript.App.csproj copies config/resolver.json into the build as is, so overwriting the
      # checked-in localhost default here bakes the production resolver into the release.
      - name: Point resolver.json at the production resolver
        env:
          RESOLVER_URL: ${{ secrets.RESOLVER_URL }}
          RESOLVER_API_KEY: ${{ secrets.RESOLVER_API_KEY }}
        run: |
          jq -n --arg url "$RESOLVER_URL" --arg key "$RESOLVER_API_KEY" \
            '{url: $url, apiKey: $key}' > config/resolver.json

      - name: Build the bundle
        run: make windows CONFIG=Release

      - name: Package
        run: |
          (cd dist && mv Release-win Tript && zip -qr "../$ARCHIVE" Tript)
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: The bundle is complete
        run: |
          tests/Tript.Smoke/check-windows-bundle.sh "$ARCHIVE"
          unzip -p "$ARCHIVE" Tript/App/resolver.json | tests/Tript.Smoke/check-production-resolver.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 1
          if-no-files-found: error

  release-linux:
    name: Release (Linux)
    needs: [verify, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE: Tript-${{ needs.verify.outputs.version }}-linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup

      - name: Point resolver.json at the production resolver
        env:
          RESOLVER_URL: ${{ secrets.RESOLVER_URL }}
          RESOLVER_API_KEY: ${{ secrets.RESOLVER_API_KEY }}
        run: |
          jq -n --arg url "$RESOLVER_URL" --arg key "$RESOLVER_API_KEY" \
            '{url: $url, apiKey: $key}' > config/resolver.json

      - name: Build the package
        run: |
          make linux-package CONFIG=Release
          mv "dist/Release-linux/$PACKAGE.tar.gz" "dist/Release-linux/$PACKAGE.tar.gz.sha256" .

      - name: The package installs for a user and starts
        run: |
          tests/Tript.Smoke/test-linux-package.sh "$PACKAGE.tar.gz"
          tar -xzOf "$PACKAGE.tar.gz" "$PACKAGE/app/resolver.json" | tests/Tript.Smoke/check-production-resolver.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [verify, release-windows, release-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Checksums match
        working-directory: release
        run: sha256sum -c ./*.sha256

      - name: Create the GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "$PRERELEASE" == true ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tript $GITHUB_REF_NAME" \
            --generate-notes \
            "${FLAGS[@]}"
