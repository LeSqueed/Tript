# Fine-tune PP-OCRv3-English (SVTR_LCNet / MobileNetV1) from its pretrained checkpoint on a game's
# OCR crops. Lighter than v4 for CPU training. Machine-specific paths (pretrained_model,
# character_dict_path, data_dir, label_file_list, save_model_dir) are overridden with -o by
# finetune_ocr.py, which also rewrites max_text_length (below) per game from the longest label.
Global:
  debug: false
  use_gpu: false
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ./output/rec_finetune
  save_epoch_step: 100
  eval_batch_step: [0, 100]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: ppocr/utils/en_dict.txt
  max_text_length: &max_text_length 43
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec_finetune/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_pool_kernel_size: [2, 2]
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 64
          depth: 2
          hidden_dims: 120
          use_guide: true
        Head:
          fc_decay: 0.00001
    - SARHead:
        enc_dim: 512
        max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - SARLoss: null

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list: [./train_data/train_list.txt]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug: null
    - MultiLabelEncode: null
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys: [image, label_ctc, label_sar, length, valid_ratio]
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: false
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list: [./train_data/val_list.txt]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode: null
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys: [image, label_ctc, label_sar, length, valid_ratio]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
