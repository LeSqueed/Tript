# Fine-tune PP-OCRv4-English (SVTR_LCNet / PPLCNetV3) from its pretrained checkpoint on a game's
# OCR crops. Keeps the NRTR aux head - PaddleOCR's tools/train.py assumes a second MultiLoss entry
# for a MultiHead model, and only the CTC branch is exported anyway. Machine-specific paths
# (pretrained_model, character_dict_path, data_dir, label_file_list, save_model_dir) are overridden
# with -o by finetune_ocr.py, which also rewrites max_text_length (below) per game from the longest
# label. CPU only - PaddlePaddle has no Windows GPU and finetune_ocr.py caps the synthetic set.
Global:
  debug: false
  use_gpu: false
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./output/rec_finetune
  save_epoch_step: 100
  eval_batch_step: [0, 100]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: ppocr/utils/en_dict.txt
  max_text_length: &max_text_length 43
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec_finetune/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size: [1, 3]
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list: [./train_data/train_list.txt]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug:
        tia_prob: 0.2
        crop_prob: 0.2
        reverse_prob: 0.0
        noise_prob: 0.2
        jitter_prob: 0.3
        blur_prob: 0.2
        hsv_aug_prob: 0.5
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: false
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data
    label_file_list: [./train_data/val_list.txt]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 8
    num_workers: 0
